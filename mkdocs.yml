site_name: Space Engineers RTS
site_description: RTS-style automation for player-owned ships in Space Engineers
docs_dir: docs
site_dir: site
use_directory_urls: true

# docs/README.md is the GitHub docs index; on the site it is published as
# all-docs.md (generated by scripts/build-docs-site.sh) so it cannot shadow
# index.md.
exclude_docs: |
  README.md

theme:
  name: material
  palette:
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Overview: index.md
  - Install: INSTALL.md
  - Build from source: BUILDING.md
  - Configuration: CONFIGURATION.md
  - In-game setup: IN-GAME-SETUP.md
  - Safety: SAFETY.md
  - Reference:
      - Architecture: architecture.md
      - Ship roles: ship-roles.md
      - Survival mode: survival-mode.md
      - Survival loop: survival-loop.md
      - Flight safety guards: flight-guards.md
      - Sim-speed gating: simspeed.md
  - Troubleshooting: TROUBLESHOOTING.md
  - FAQ: FAQ.md
  - All documentation: all-docs.md
