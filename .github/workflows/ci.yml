name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-and-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: npm
      - run: npm ci
      - name: Typecheck (root)
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build the site
        run: npm run demo:build

  # The plugin itself is not built in CI: it needs the Space Engineers
  # DedicatedServer64 reference assemblies, which are Keen's and are not
  # redistributable. Build it locally with SE_DS_BIN set; see docs/INSTALL.md.
